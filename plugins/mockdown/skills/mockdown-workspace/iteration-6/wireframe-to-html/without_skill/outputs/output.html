<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #1a1a2e;
      background-color: #f5f6fa;
      line-height: 1.6;
    }

    /* ── Header / Navbar ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 2rem;
      background-color: #ffffff;
      border-bottom: 1px solid #e0e0e0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 2rem;
    }

    .logo {
      font-size: 1.25rem;
      font-weight: 700;
      color: #1a1a2e;
      text-decoration: none;
    }

    nav {
      display: flex;
      gap: 1.5rem;
    }

    nav a {
      text-decoration: none;
      color: #555;
      font-size: 0.95rem;
      font-weight: 500;
      transition: color 0.2s;
    }

    nav a:hover {
      color: #4361ee;
    }

    .btn-signup {
      display: inline-block;
      padding: 0.5rem 1.25rem;
      background-color: #4361ee;
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-signup:hover {
      background-color: #3a56d4;
    }

    /* ── Main Content ── */
    main {
      display: flex;
      justify-content: center;
      padding: 3rem 1.5rem;
    }

    .card {
      width: 100%;
      max-width: 640px;
      background-color: #ffffff;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }

    .card-header {
      padding: 1.25rem 1.75rem;
      border-bottom: 1px solid #e8e8e8;
    }

    .card-header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #1a1a2e;
    }

    .card-body {
      padding: 2rem 1.75rem;
    }

    .subscribe-form {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }

    .subscribe-form input[type="email"] {
      flex: 1;
      padding: 0.65rem 1rem;
      font-size: 0.95rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      outline: none;
      transition: border-color 0.2s;
    }

    .subscribe-form input[type="email"]::placeholder {
      color: #999;
    }

    .subscribe-form input[type="email"]:focus {
      border-color: #4361ee;
    }

    .btn-subscribe {
      padding: 0.65rem 1.5rem;
      background-color: #4361ee;
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
      white-space: nowrap;
    }

    .btn-subscribe:hover {
      background-color: #3a56d4;
    }

    .terms-label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
      color: #555;
      cursor: pointer;
    }

    .terms-label input[type="checkbox"] {
      width: 1rem;
      height: 1rem;
      accent-color: #4361ee;
      cursor: pointer;
    }

    /* ── Responsive ── */
    @media (max-width: 520px) {
      header {
        flex-wrap: wrap;
        gap: 1rem;
      }

      .subscribe-form {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <a href="#" class="logo">Logo</a>
      <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
      </nav>
    </div>
    <a href="#" class="btn-signup">Sign Up</a>
  </header>

  <main>
    <section class="card">
      <div class="card-header">
        <h1>Welcome</h1>
      </div>
      <div class="card-body">
        <form class="subscribe-form" action="#" method="post">
          <input type="email" placeholder="Enter your email..." required>
          <button type="submit" class="btn-subscribe">Subscribe</button>
        </form>
        <label class="terms-label">
          <input type="checkbox" checked>
          I agree to the terms
        </label>
      </div>
    </section>
  </main>

</body>
</html>
