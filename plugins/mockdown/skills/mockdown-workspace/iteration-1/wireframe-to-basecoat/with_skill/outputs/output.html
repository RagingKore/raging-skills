<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wireframe - Basecoat UI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="https://unpkg.com/@nicecss/basecoat@latest/dist/basecoat.min.css">
</head>
<body class="p-8 max-w-4xl mx-auto">

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active">Tab 1</button>
    <button class="tab">Tab 2</button>
    <button class="tab">Tab 3</button>
  </div>

  <!-- Search Input with Lucide icon -->
  <div class="relative mt-6">
    <div class="absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none text-muted-foreground">
      <i data-lucide="search" class="size-4"></i>
    </div>
    <input class="input pl-9 w-full" placeholder="Search...">
  </div>

  <!-- Table -->
  <div class="overflow-x-auto mt-6">
    <table class="table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Role</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td></td>
          <td></td>
          <td></td>
        </tr>
        <tr>
          <td></td>
          <td></td>
          <td></td>
        </tr>
        <tr>
          <td></td>
          <td></td>
          <td></td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Pagination -->
  <nav class="pagination mt-6">
    <button class="btn-icon-outline">
      <i data-lucide="chevron-left" class="size-4"></i>
    </button>
    <a href="#" class="btn-ghost">1</a>
    <a href="#" class="btn-ghost">2</a>
    <span class="btn-outline" aria-current="page">3</span>
    <a href="#" class="btn-ghost">4</a>
    <a href="#" class="btn-ghost">5</a>
    <span class="btn-ghost">...</span>
    <button class="btn-icon-outline">
      <i data-lucide="chevron-right" class="size-4"></i>
    </button>
  </nav>

  <script>lucide.createIcons();</script>
</body>
</html>
