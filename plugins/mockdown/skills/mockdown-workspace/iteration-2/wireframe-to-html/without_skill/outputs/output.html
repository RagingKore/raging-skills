<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #333;
      background: #f5f5f5;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 32px;
      background: #fff;
      border-bottom: 2px solid #333;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 32px;
    }

    .logo {
      font-weight: 700;
      font-size: 1.25rem;
    }

    nav {
      display: flex;
      gap: 24px;
    }

    nav a {
      text-decoration: none;
      color: #333;
      font-size: 0.95rem;
    }

    nav a:hover {
      text-decoration: underline;
    }

    .sign-up-btn {
      padding: 8px 20px;
      border: 2px solid #333;
      background: transparent;
      font-size: 0.95rem;
      cursor: pointer;
      border-radius: 4px;
    }

    .sign-up-btn:hover {
      background: #333;
      color: #fff;
    }

    main {
      display: flex;
      justify-content: center;
      padding: 48px 32px;
    }

    .card {
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 8px;
      width: 100%;
      max-width: 640px;
      overflow: hidden;
    }

    .card-header {
      padding: 16px 24px;
      border-bottom: 1px solid #ccc;
    }

    .card-header h1 {
      font-size: 1.5rem;
      font-weight: 600;
    }

    .card-body {
      padding: 32px 24px;
    }

    .subscribe-form {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    .subscribe-form input[type="email"] {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.95rem;
    }

    .subscribe-form input[type="email"]:focus {
      outline: none;
      border-color: #666;
    }

    .subscribe-btn {
      padding: 10px 20px;
      background: #333;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .subscribe-btn:hover {
      background: #555;
    }

    .terms-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .terms-label input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <div class="logo">Logo</div>
      <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
      </nav>
    </div>
    <button class="sign-up-btn">Sign Up</button>
  </header>

  <main>
    <div class="card">
      <div class="card-header">
        <h1>Welcome</h1>
      </div>
      <div class="card-body">
        <form>
          <div class="subscribe-form">
            <input type="email" placeholder="Enter your email...">
            <button type="submit" class="subscribe-btn">Subscribe</button>
          </div>
          <label class="terms-label">
            <input type="checkbox" checked>
            I agree to the terms
          </label>
        </form>
      </div>
    </div>
  </main>
</body>
</html>
