<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #1a1a1a;
      background-color: #f5f5f5;
      min-height: 100vh;
    }

    /* ── Navbar ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 32px;
      background-color: #ffffff;
      border-bottom: 1px solid #d4d4d4;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 32px;
    }

    .logo {
      font-size: 20px;
      font-weight: 700;
      text-decoration: none;
      color: #1a1a1a;
    }

    nav {
      display: flex;
      gap: 24px;
    }

    nav a {
      text-decoration: none;
      color: #525252;
      font-size: 15px;
      font-weight: 500;
    }

    nav a:hover {
      color: #1a1a1a;
    }

    .nav-right {
      display: flex;
      align-items: center;
    }

    .btn-signup {
      padding: 8px 20px;
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      background-color: #2563eb;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
    }

    .btn-signup:hover {
      background-color: #1d4ed8;
    }

    /* ── Main Card ── */
    main {
      display: flex;
      justify-content: center;
      padding: 64px 24px;
    }

    .card {
      width: 100%;
      max-width: 640px;
      background-color: #ffffff;
      border: 1px solid #d4d4d4;
      border-radius: 8px;
      overflow: hidden;
    }

    .card-header {
      padding: 20px 28px;
      border-bottom: 1px solid #d4d4d4;
    }

    .card-header h1 {
      font-size: 22px;
      font-weight: 700;
    }

    .card-body {
      padding: 32px 28px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .subscribe-row {
      display: flex;
      gap: 12px;
    }

    .subscribe-row input[type="email"] {
      flex: 1;
      padding: 10px 14px;
      font-size: 15px;
      border: 1px solid #d4d4d4;
      border-radius: 6px;
      outline: none;
    }

    .subscribe-row input[type="email"]:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
    }

    .btn-subscribe {
      padding: 10px 22px;
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      background-color: #2563eb;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-subscribe:hover {
      background-color: #1d4ed8;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .checkbox-row input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #2563eb;
      cursor: pointer;
    }

    .checkbox-row label {
      font-size: 15px;
      color: #525252;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <header>
    <div class="nav-left">
      <a href="#" class="logo">Logo</a>
      <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
      </nav>
    </div>
    <div class="nav-right">
      <a href="#" class="btn-signup">Sign Up</a>
    </div>
  </header>

  <!-- Main Content -->
  <main>
    <div class="card">
      <div class="card-header">
        <h1>Welcome</h1>
      </div>
      <div class="card-body">
        <div class="subscribe-row">
          <input type="email" placeholder="Enter your email...">
          <button class="btn-subscribe" type="button">Subscribe</button>
        </div>
        <div class="checkbox-row">
          <input type="checkbox" id="terms" checked>
          <label for="terms">I agree to the terms</label>
        </div>
      </div>
    </div>
  </main>

</body>
</html>
