<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Basecoat UI - Tabs, Search, Table &amp; Pagination</title>

  <!-- Tailwind CSS v4 via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <style>
    /* Dark theme variables matching Basecoat / shadcn style */
    :root {
      --background: 0 0% 100%;
      --foreground: 240 10% 3.9%;
      --card: 0 0% 100%;
      --card-foreground: 240 10% 3.9%;
      --popover: 0 0% 100%;
      --popover-foreground: 240 10% 3.9%;
      --primary: 240 5.9% 10%;
      --primary-foreground: 0 0% 98%;
      --secondary: 240 4.8% 95.9%;
      --secondary-foreground: 240 5.9% 10%;
      --muted: 240 4.8% 95.9%;
      --muted-foreground: 240 3.8% 46.1%;
      --accent: 240 4.8% 95.9%;
      --accent-foreground: 240 5.9% 10%;
      --destructive: 0 84.2% 60.2%;
      --destructive-foreground: 0 0% 98%;
      --border: 240 5.9% 90%;
      --input: 240 5.9% 90%;
      --ring: 240 5.9% 10%;
      --radius: 0.5rem;
    }

    .dark {
      --background: 240 10% 3.9%;
      --foreground: 0 0% 98%;
      --card: 240 10% 3.9%;
      --card-foreground: 0 0% 98%;
      --popover: 240 10% 3.9%;
      --popover-foreground: 0 0% 98%;
      --primary: 0 0% 98%;
      --primary-foreground: 240 5.9% 10%;
      --secondary: 240 3.7% 15.9%;
      --secondary-foreground: 0 0% 98%;
      --muted: 240 3.7% 15.9%;
      --muted-foreground: 240 5% 64.9%;
      --accent: 240 3.7% 15.9%;
      --accent-foreground: 0 0% 98%;
      --destructive: 0 62.8% 30.6%;
      --destructive-foreground: 0 0% 98%;
      --border: 240 3.7% 15.9%;
      --input: 240 3.7% 15.9%;
      --ring: 240 4.9% 83.9%;
    }

    body {
      background-color: hsl(var(--background));
      color: hsl(var(--foreground));
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
  </style>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            border: 'hsl(var(--border))',
            input: 'hsl(var(--input))',
            ring: 'hsl(var(--ring))',
            background: 'hsl(var(--background))',
            foreground: 'hsl(var(--foreground))',
            primary: {
              DEFAULT: 'hsl(var(--primary))',
              foreground: 'hsl(var(--primary-foreground))',
            },
            secondary: {
              DEFAULT: 'hsl(var(--secondary))',
              foreground: 'hsl(var(--secondary-foreground))',
            },
            muted: {
              DEFAULT: 'hsl(var(--muted))',
              foreground: 'hsl(var(--muted-foreground))',
            },
            accent: {
              DEFAULT: 'hsl(var(--accent))',
              foreground: 'hsl(var(--accent-foreground))',
            },
            destructive: {
              DEFAULT: 'hsl(var(--destructive))',
              foreground: 'hsl(var(--destructive-foreground))',
            },
            card: {
              DEFAULT: 'hsl(var(--card))',
              foreground: 'hsl(var(--card-foreground))',
            },
          },
          borderRadius: {
            lg: 'var(--radius)',
            md: 'calc(var(--radius) - 2px)',
            sm: 'calc(var(--radius) - 4px)',
          },
        },
      },
    }
  </script>
</head>
<body class="min-h-screen p-8">
  <div class="mx-auto max-w-4xl space-y-6">

    <!-- ===================== TABS ===================== -->
    <div data-component="tabs">
      <!-- Tab List -->
      <div class="inline-flex h-10 items-center justify-center rounded-md bg-muted p-1 text-muted-foreground" role="tablist">
        <!-- Active tab -->
        <button
          role="tab"
          aria-selected="true"
          data-tab="tab1"
          class="tab-trigger inline-flex items-center justify-center whitespace-nowrap rounded-sm px-3 py-1.5 text-sm font-medium ring-offset-background transition-all focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 bg-background text-foreground shadow-sm"
        >
          Tab 1
        </button>
        <!-- Inactive tabs -->
        <button
          role="tab"
          aria-selected="false"
          data-tab="tab2"
          class="tab-trigger inline-flex items-center justify-center whitespace-nowrap rounded-sm px-3 py-1.5 text-sm font-medium ring-offset-background transition-all focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 hover:bg-background/50 hover:text-foreground"
        >
          Tab 2
        </button>
        <button
          role="tab"
          aria-selected="false"
          data-tab="tab3"
          class="tab-trigger inline-flex items-center justify-center whitespace-nowrap rounded-sm px-3 py-1.5 text-sm font-medium ring-offset-background transition-all focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 hover:bg-background/50 hover:text-foreground"
        >
          Tab 3
        </button>
      </div>

      <!-- Tab Content (Tab 1 active) -->
      <div class="mt-4 space-y-6" role="tabpanel" data-content="tab1">

        <!-- ===================== SEARCH INPUT ===================== -->
        <div class="relative">
          <i data-lucide="search" class="absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-muted-foreground"></i>
          <input
            type="text"
            placeholder="Search..."
            class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 pl-10 text-sm ring-offset-background placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2"
          />
        </div>

        <!-- ===================== TABLE ===================== -->
        <div class="rounded-md border border-border">
          <table class="w-full caption-bottom text-sm">
            <thead class="[&_tr]:border-b">
              <tr class="border-b border-border transition-colors hover:bg-muted/50">
                <th class="h-12 px-4 text-left align-middle font-medium text-muted-foreground">
                  <div class="flex items-center gap-2">
                    <i data-lucide="user" class="h-4 w-4"></i>
                    Name
                  </div>
                </th>
                <th class="h-12 px-4 text-left align-middle font-medium text-muted-foreground">
                  <div class="flex items-center gap-2">
                    <i data-lucide="mail" class="h-4 w-4"></i>
                    Email
                  </div>
                </th>
                <th class="h-12 px-4 text-left align-middle font-medium text-muted-foreground">
                  <div class="flex items-center gap-2">
                    <i data-lucide="shield" class="h-4 w-4"></i>
                    Role
                  </div>
                </th>
              </tr>
            </thead>
            <tbody class="[&_tr:last-child]:border-0">
              <tr class="border-b border-border transition-colors hover:bg-muted/50">
                <td class="p-4 align-middle">Olivia Martin</td>
                <td class="p-4 align-middle text-muted-foreground">olivia@example.com</td>
                <td class="p-4 align-middle">
                  <span class="inline-flex items-center rounded-full border border-border px-2.5 py-0.5 text-xs font-semibold transition-colors">Admin</span>
                </td>
              </tr>
              <tr class="border-b border-border transition-colors hover:bg-muted/50">
                <td class="p-4 align-middle">Jackson Lee</td>
                <td class="p-4 align-middle text-muted-foreground">jackson@example.com</td>
                <td class="p-4 align-middle">
                  <span class="inline-flex items-center rounded-full border border-border px-2.5 py-0.5 text-xs font-semibold transition-colors">Editor</span>
                </td>
              </tr>
              <tr class="border-b border-border transition-colors hover:bg-muted/50">
                <td class="p-4 align-middle">Isabella Nguyen</td>
                <td class="p-4 align-middle text-muted-foreground">isabella@example.com</td>
                <td class="p-4 align-middle">
                  <span class="inline-flex items-center rounded-full border border-border px-2.5 py-0.5 text-xs font-semibold transition-colors">Viewer</span>
                </td>
              </tr>
              <tr class="border-b border-border transition-colors hover:bg-muted/50">
                <td class="p-4 align-middle">William Kim</td>
                <td class="p-4 align-middle text-muted-foreground">william@example.com</td>
                <td class="p-4 align-middle">
                  <span class="inline-flex items-center rounded-full border border-border px-2.5 py-0.5 text-xs font-semibold transition-colors">Editor</span>
                </td>
              </tr>
              <tr class="transition-colors hover:bg-muted/50">
                <td class="p-4 align-middle">Sofia Davis</td>
                <td class="p-4 align-middle text-muted-foreground">sofia@example.com</td>
                <td class="p-4 align-middle">
                  <span class="inline-flex items-center rounded-full border border-border px-2.5 py-0.5 text-xs font-semibold transition-colors">Viewer</span>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- ===================== PAGINATION ===================== -->
        <nav class="flex items-center justify-center gap-1" aria-label="Pagination">
          <!-- Previous button -->
          <button class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 border border-input bg-background hover:bg-accent hover:text-accent-foreground h-9 w-9">
            <i data-lucide="chevron-left" class="h-4 w-4"></i>
            <span class="sr-only">Previous page</span>
          </button>

          <!-- Page 1 -->
          <button class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 border border-input bg-background hover:bg-accent hover:text-accent-foreground h-9 w-9">
            1
          </button>

          <!-- Page 2 -->
          <button class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 border border-input bg-background hover:bg-accent hover:text-accent-foreground h-9 w-9">
            2
          </button>

          <!-- Page 3 (active) -->
          <button class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 bg-primary text-primary-foreground hover:bg-primary/90 h-9 w-9" aria-current="page">
            3
          </button>

          <!-- Page 4 -->
          <button class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 border border-input bg-background hover:bg-accent hover:text-accent-foreground h-9 w-9">
            4
          </button>

          <!-- Page 5 -->
          <button class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 border border-input bg-background hover:bg-accent hover:text-accent-foreground h-9 w-9">
            5
          </button>

          <!-- Ellipsis -->
          <span class="flex h-9 w-9 items-center justify-center">
            <i data-lucide="more-horizontal" class="h-4 w-4 text-muted-foreground"></i>
          </span>

          <!-- Next button -->
          <button class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 border border-input bg-background hover:bg-accent hover:text-accent-foreground h-9 w-9">
            <i data-lucide="chevron-right" class="h-4 w-4"></i>
            <span class="sr-only">Next page</span>
          </button>
        </nav>

      </div><!-- end tab content -->
    </div><!-- end tabs -->

  </div>

  <!-- Tab switching logic -->
  <script>
    // Initialize Lucide icons
    lucide.createIcons();

    // Tab switching
    document.querySelectorAll('.tab-trigger').forEach(trigger => {
      trigger.addEventListener('click', () => {
        // Update active states
        document.querySelectorAll('.tab-trigger').forEach(t => {
          t.setAttribute('aria-selected', 'false');
          t.classList.remove('bg-background', 'text-foreground', 'shadow-sm');
          t.classList.add('hover:bg-background/50', 'hover:text-foreground');
        });
        trigger.setAttribute('aria-selected', 'true');
        trigger.classList.add('bg-background', 'text-foreground', 'shadow-sm');
        trigger.classList.remove('hover:bg-background/50', 'hover:text-foreground');
      });
    });
  </script>
</body>
</html>
