<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #1a1a2e;
      background: #f5f6fa;
      line-height: 1.6;
    }

    /* Nav Bar */
    nav {
      display: flex;
      align-items: center;
      gap: 2rem;
      padding: 1rem 2rem;
      background: #fff;
      border-bottom: 2px solid #e0e0e0;
    }

    nav .logo {
      font-weight: 700;
      font-size: 1.2rem;
      color: #1a1a2e;
      letter-spacing: -0.02em;
    }

    nav .nav-links {
      display: flex;
      gap: 1.5rem;
    }

    nav .nav-links a {
      text-decoration: none;
      color: #444;
      font-size: 0.95rem;
      transition: color 0.2s;
    }

    nav .nav-links a:hover {
      color: #1a1a2e;
    }

    nav .cta {
      margin-left: auto;
    }

    nav .cta button {
      padding: 0.5rem 1.25rem;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    nav .cta button:hover {
      background: #1d4ed8;
    }

    /* Main content */
    .container {
      max-width: 640px;
      margin: 3rem auto;
      padding: 0 1.5rem;
    }

    /* Card */
    .card {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .card-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid #e0e0e0;
    }

    .card-header h2 {
      font-size: 1.35rem;
      font-weight: 600;
      color: #1a1a2e;
    }

    .card-body {
      padding: 1.75rem 1.5rem;
    }

    /* Subscribe row */
    .subscribe-row {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }

    .subscribe-row input[type="email"] {
      flex: 1;
      padding: 0.6rem 0.85rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.95rem;
      color: #333;
      outline: none;
      transition: border-color 0.2s;
    }

    .subscribe-row input[type="email"]:focus {
      border-color: #2563eb;
    }

    .subscribe-row button {
      padding: 0.6rem 1.25rem;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }

    .subscribe-row button:hover {
      background: #1d4ed8;
    }

    /* Checkbox */
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .checkbox-row input[type="checkbox"] {
      width: 1rem;
      height: 1rem;
      accent-color: #2563eb;
      cursor: pointer;
    }

    .checkbox-row label {
      font-size: 0.9rem;
      color: #555;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <nav>
    <span class="logo">Logo</span>
    <div class="nav-links">
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </div>
    <div class="cta">
      <button>Sign Up</button>
    </div>
  </nav>

  <div class="container">
    <article class="card">
      <div class="card-header">
        <h2>Welcome</h2>
      </div>
      <div class="card-body">
        <div class="subscribe-row">
          <input type="email" placeholder="Enter your email...">
          <button>Subscribe</button>
        </div>
        <div class="checkbox-row">
          <input type="checkbox" id="terms" checked>
          <label for="terms">I agree to the terms</label>
        </div>
      </div>
    </article>
  </div>
</body>
</html>
