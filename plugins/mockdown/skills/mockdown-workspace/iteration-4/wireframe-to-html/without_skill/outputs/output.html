<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #333;
      background-color: #f5f5f5;
      line-height: 1.6;
    }

    /* ── Navigation ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 32px;
      background-color: #fff;
      border-bottom: 2px solid #e0e0e0;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 32px;
    }

    .logo {
      font-size: 20px;
      font-weight: 700;
      color: #111;
      text-decoration: none;
    }

    nav {
      display: flex;
      gap: 24px;
    }

    nav a {
      text-decoration: none;
      color: #555;
      font-size: 15px;
      font-weight: 500;
      transition: color 0.2s;
    }

    nav a:hover {
      color: #111;
    }

    .nav-right {
      display: flex;
      align-items: center;
    }

    .btn-signup {
      padding: 8px 20px;
      border: 2px solid #333;
      border-radius: 6px;
      background: transparent;
      color: #333;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, color 0.2s;
    }

    .btn-signup:hover {
      background-color: #333;
      color: #fff;
    }

    /* ── Main Card ── */
    main {
      display: flex;
      justify-content: center;
      padding: 60px 24px;
    }

    .card {
      width: 100%;
      max-width: 640px;
      background-color: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      overflow: hidden;
    }

    .card-header {
      padding: 16px 24px;
      border-bottom: 1px solid #ddd;
      background-color: #fafafa;
    }

    .card-header h1 {
      font-size: 22px;
      font-weight: 600;
      color: #111;
    }

    .card-body {
      padding: 32px 24px;
    }

    .subscribe-form {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }

    .subscribe-form input[type="email"] {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    .subscribe-form input[type="email"]::placeholder {
      color: #999;
    }

    .subscribe-form input[type="email"]:focus {
      border-color: #666;
    }

    .btn-subscribe {
      padding: 10px 22px;
      background-color: #333;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.2s;
    }

    .btn-subscribe:hover {
      background-color: #555;
    }

    .terms-check {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .terms-check input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #333;
      cursor: pointer;
    }

    .terms-check label {
      font-size: 14px;
      color: #555;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <header>
    <div class="nav-left">
      <a href="#" class="logo">Logo</a>
      <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
      </nav>
    </div>
    <div class="nav-right">
      <button class="btn-signup">Sign Up</button>
    </div>
  </header>

  <!-- Main Content -->
  <main>
    <div class="card">
      <div class="card-header">
        <h1>Welcome</h1>
      </div>
      <div class="card-body">
        <form class="subscribe-form" onsubmit="return false;">
          <input type="email" placeholder="Enter your email..." required>
          <button type="submit" class="btn-subscribe">Subscribe</button>
        </form>
        <div class="terms-check">
          <input type="checkbox" id="terms" checked>
          <label for="terms">I agree to the terms</label>
        </div>
      </div>
    </div>
  </main>

</body>
</html>
