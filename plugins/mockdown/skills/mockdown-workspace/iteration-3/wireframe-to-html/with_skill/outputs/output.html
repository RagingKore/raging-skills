<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; color: #1a1a1a; background: #f5f5f5; }

    /* Nav Bar */
    nav {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      padding: 1rem 2rem;
      background: #fff;
      border-bottom: 2px solid #e5e5e5;
    }
    nav .logo {
      font-weight: 700;
      font-size: 1.1rem;
      margin-right: 0.5rem;
    }
    nav a {
      text-decoration: none;
      color: #444;
      font-size: 0.95rem;
    }
    nav a:hover { color: #111; }
    nav .cta {
      margin-left: auto;
      padding: 0.5rem 1.25rem;
      background: #111;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      cursor: pointer;
    }
    nav .cta:hover { background: #333; }

    /* Container */
    .container {
      max-width: 640px;
      margin: 3rem auto;
      padding: 0 1.5rem;
    }

    /* Card */
    .card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      overflow: hidden;
    }
    .card-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid #e5e5e5;
    }
    .card-header h2 {
      font-size: 1.35rem;
      font-weight: 600;
    }
    .card-body {
      padding: 1.75rem 1.5rem;
    }

    /* Subscribe row */
    .subscribe-row {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }
    .subscribe-row input[type="email"] {
      flex: 1;
      padding: 0.6rem 0.85rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.95rem;
    }
    .subscribe-row input[type="email"]:focus {
      outline: none;
      border-color: #888;
    }
    .subscribe-row button {
      padding: 0.6rem 1.25rem;
      background: #111;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .subscribe-row button:hover { background: #333; }

    /* Checkbox */
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
      color: #555;
    }
    .checkbox-row input[type="checkbox"] {
      width: 1rem;
      height: 1rem;
      accent-color: #111;
    }
  </style>
</head>
<body>
  <nav>
    <span class="logo">Logo</span>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
    <button class="cta">Sign Up</button>
  </nav>

  <div class="container">
    <article class="card">
      <div class="card-header">
        <h2>Welcome</h2>
      </div>
      <div class="card-body">
        <div class="subscribe-row">
          <input type="email" placeholder="Enter your email...">
          <button>Subscribe</button>
        </div>
        <label class="checkbox-row">
          <input type="checkbox" checked>
          I agree to the terms
        </label>
      </div>
    </article>
  </div>
</body>
</html>
