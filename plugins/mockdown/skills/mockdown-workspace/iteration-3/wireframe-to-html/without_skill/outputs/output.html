<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #333;
      background-color: #f5f5f5;
      min-height: 100vh;
    }

    /* ── Navbar ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 32px;
      background-color: #fff;
      border-bottom: 1px solid #ddd;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 32px;
    }

    .logo {
      font-size: 1.25rem;
      font-weight: 700;
      text-decoration: none;
      color: #111;
    }

    nav {
      display: flex;
      gap: 24px;
    }

    nav a {
      text-decoration: none;
      color: #555;
      font-size: 0.95rem;
      transition: color 0.2s;
    }

    nav a:hover {
      color: #111;
    }

    .btn-signup {
      display: inline-block;
      padding: 8px 20px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #fff;
      background-color: #111;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.2s;
    }

    .btn-signup:hover {
      background-color: #333;
    }

    /* ── Card ── */
    main {
      display: flex;
      justify-content: center;
      padding: 64px 24px;
    }

    .card {
      width: 100%;
      max-width: 600px;
      background-color: #fff;
      border: 1px solid #ddd;
      border-radius: 10px;
      overflow: hidden;
    }

    .card-header {
      padding: 20px 28px;
      border-bottom: 1px solid #ddd;
    }

    .card-header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #111;
    }

    .card-body {
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .subscribe-row {
      display: flex;
      gap: 12px;
    }

    .subscribe-row input[type="email"] {
      flex: 1;
      padding: 10px 14px;
      font-size: 0.95rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      outline: none;
      transition: border-color 0.2s;
    }

    .subscribe-row input[type="email"]:focus {
      border-color: #111;
    }

    .btn-subscribe {
      padding: 10px 22px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #fff;
      background-color: #111;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-subscribe:hover {
      background-color: #333;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .checkbox-row input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #111;
      cursor: pointer;
    }

    .checkbox-row label {
      font-size: 0.9rem;
      color: #555;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <header>
    <div class="nav-left">
      <a href="#" class="logo">Logo</a>
      <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
      </nav>
    </div>
    <a href="#" class="btn-signup">Sign Up</a>
  </header>

  <!-- Main content -->
  <main>
    <div class="card">
      <div class="card-header">
        <h1>Welcome</h1>
      </div>
      <div class="card-body">
        <form>
          <div class="subscribe-row">
            <input type="email" placeholder="Enter your email..." required>
            <button type="submit" class="btn-subscribe">Subscribe</button>
          </div>
          <div class="checkbox-row" style="margin-top: 8px;">
            <input type="checkbox" id="terms" checked>
            <label for="terms">I agree to the terms</label>
          </div>
        </form>
      </div>
    </div>
  </main>

</body>
</html>
