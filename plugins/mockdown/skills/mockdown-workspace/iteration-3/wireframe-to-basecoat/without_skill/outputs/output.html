<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wireframe - Basecoat UI</title>

  <!-- Basecoat UI CSS (via DaisyUI + Tailwind CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" type="text/css" />
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

  <style>
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
  </style>
</head>
<body class="bg-base-200 min-h-screen p-8">

  <div class="max-w-4xl mx-auto space-y-6">

    <!-- Tabs -->
    <div role="tablist" class="tabs tabs-bordered">
      <a role="tab" class="tab tab-active font-semibold">Tab 1</a>
      <a role="tab" class="tab">Tab 2</a>
      <a role="tab" class="tab">Tab 3</a>
    </div>

    <!-- Search Input -->
    <label class="input input-bordered flex items-center gap-2 w-full">
      <i data-lucide="search" class="w-4 h-4 opacity-50"></i>
      <input type="text" class="grow" placeholder="Search..." />
    </label>

    <!-- Table -->
    <div class="overflow-x-auto rounded-lg border border-base-300 bg-base-100">
      <table class="table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Role</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Alice Johnson</td>
            <td>alice@example.com</td>
            <td>Admin</td>
          </tr>
          <tr>
            <td>Bob Smith</td>
            <td>bob@example.com</td>
            <td>Editor</td>
          </tr>
          <tr>
            <td>Carol Williams</td>
            <td>carol@example.com</td>
            <td>Viewer</td>
          </tr>
          <tr>
            <td>David Brown</td>
            <td>david@example.com</td>
            <td>Editor</td>
          </tr>
          <tr>
            <td>Eve Davis</td>
            <td>eve@example.com</td>
            <td>Admin</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Pagination -->
    <div class="flex justify-center">
      <div class="join">
        <button class="join-item btn btn-sm">
          <i data-lucide="chevron-left" class="w-4 h-4"></i>
        </button>
        <button class="join-item btn btn-sm">1</button>
        <button class="join-item btn btn-sm">2</button>
        <button class="join-item btn btn-sm btn-active">3</button>
        <button class="join-item btn btn-sm">4</button>
        <button class="join-item btn btn-sm">5</button>
        <button class="join-item btn btn-sm btn-disabled">...</button>
        <button class="join-item btn btn-sm">
          <i data-lucide="chevron-right" class="w-4 h-4"></i>
        </button>
      </div>
    </div>

  </div>

  <!-- Initialize Lucide icons -->
  <script>
    lucide.createIcons();
  </script>

</body>
</html>
